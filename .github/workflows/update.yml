name: Update The Skill Index

# Self-updating reference: recompute every skill's momentum from live GitHub signals
# daily, commit the new data.json + regenerated pages, and redeploy to Vercel.
on:
  schedule:
    - cron: "33 8 * * *"   # 08:33 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: skill-index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check deployment target guard
        run: python -m unittest discover -s tests -p 'test_deploy_target.py'

      - name: Install Pillow (for og.png)
        run: pip install --quiet Pillow

      - name: Recompute data.json from GitHub signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_data.py

      - name: Regenerate detail pages + OG card
        run: |
          python gen_details.py
          python gen_og.py

      - name: Render and verify the public catalog snapshot
        run: |
          python url_lifecycle.py --render-retained
          python sanitize_detail_schema.py
          python render_home.py
          python url_lifecycle.py --verify
          python -m unittest discover -s tests -p test_retention_churn.py
          python -m unittest discover -s tests -p test_discoverability.py
          python -m unittest discover -s tests -p test_indexnow_receipts.py
          python -m unittest discover -s tests -p test_selection_guidance.py
          python -m unittest discover -s tests -p test_inclusion_gate.py
          python -m unittest discover -s tests -p test_reviewed_og.py
          node --test tests/guidance.test.mjs
          python -m unittest discover -s tests -p test_public_assets.py
          python -m unittest discover -s tests -p test_site_quality.py
          python -m unittest discover -s tests -p test_indexnow_backoff.py
          python -m unittest discover -s tests -p test_deploy_retry.py
          python -m unittest discover -s tests -p test_git_transport.py
          python -m unittest discover -s tests -p test_november5_retention.py
          python -m unittest discover -s tests -p test_november8_retention.py
          python public_assets.py --seal

      - name: Commit if changed
        run: |
          git config user.name  "skill-index-bot"
          git config user.email "actions@users.noreply.github.com"
          python git_public_snapshot.py --stage
          if ! git diff --cached --quiet; then
            git commit -m "data: daily skill-index refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No data change."
          fi

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: python deploy.py
      - name: Ping IndexNow
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: python indexnow_ping.py
