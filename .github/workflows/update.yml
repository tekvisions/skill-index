name: Update The Skill Index

# Self-updating reference: recompute every skill's momentum from live GitHub signals
# daily, commit the new data.json + regenerated pages, and redeploy to Vercel.
on:
  schedule:
    - cron: "33 8 * * *"   # 08:33 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow (for og.png)
        run: pip install --quiet Pillow

      - name: Recompute data.json from GitHub signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_data.py

      - name: Regenerate detail pages + OG card
        run: |
          python gen_details.py
          python gen_og.py

      - name: Commit if changed
        run: |
          git config user.name  "skill-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json sitemap.xml rss.xml robots.txt llms.txt og.png p/
          if ! git diff --cached --quiet; then
            git commit -m "data: daily skill-index refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No data change."
          fi

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: python deploy.py
